name: isl_pocket_signs
description: A personal reference tool for Indian Sign Language (ISL) signs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Local storage for cart persistence
  shared_preferences: ^2.2.2
  
  # Image caching (for when real images are plugged in)
  cached_network_image: ^3.3.1
  
  # Lottie animations (optional, for animated signs)
  lottie: ^3.0.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/alphabet/
    - assets/words/
    - assets/images/
